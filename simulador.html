<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador de suelo — Suelos La Giralda</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --stone: #E7E0D2;
    --stone-light: #F4EFE4;
    --card: #FBF8F1;
    --walnut: #2A2118;
    --walnut-soft: #453626;
    --oak: #8B5E34;
    --oak-deep: #6E4626;
    --azulejo: #33544D;
    --azulejo-light: #4E766D;
    --ocre: #C0932E;
    --line: rgba(42,33,24,0.14);
    --shadow: 0 12px 30px rgba(42,33,24,0.10);
  }

  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--stone);
    color:var(--walnut);
    font-family:'Work Sans', sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{
    font-family:'Fraunces', serif;
    font-weight:600;
    letter-spacing:-0.01em;
    color:var(--walnut);
  }
  .mono{ font-family:'IBM Plex Mono', monospace; letter-spacing:0.03em; }
  a{color:inherit;}
  img{max-width:100%; display:block;}
  .wrap{max-width:1180px; margin:0 auto; padding:0 28px;}

  /* ---------- HEADER (idéntico al index) ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(42,33,24,0.94);
    backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 28px; max-width:1180px; margin:0 auto;
  }
  .brand{
    display:flex; align-items:baseline; gap:6px;
    font-family:'Fraunces', serif; font-weight:600; font-size:1.28rem;
    letter-spacing:-0.01em;
  }
  .brand .word-oak{ color:var(--ocre); }
  .brand .word-cream{ color:var(--stone-light); }
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:11px 20px; border-radius:2px;
    font-weight:600; font-size:0.92rem; text-decoration:none;
    border:1px solid transparent; cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn-primary{ background:var(--oak-deep); color:var(--stone-light); }
  .btn-primary:hover{background:var(--walnut); transform:translateY(-1px);}
  .btn-wa{
    background:var(--azulejo); color:var(--stone-light);
    box-shadow:0 10px 26px rgba(51,84,77,0.28);
  }
  .btn-wa:hover{ background:#284440; transform:translateY(-1px); box-shadow:0 14px 32px rgba(51,84,77,0.38); }

  /* ---------- HERO DEL SIMULADOR ---------- */
  .sim-hero{
    padding:64px 0 8px; text-align:center;
  }
  .sim-eyebrow{
    display:inline-flex; align-items:center; gap:10px;
    font-family:'IBM Plex Mono', monospace; font-size:0.78rem;
    letter-spacing:0.12em; text-transform:uppercase;
    color:var(--azulejo); margin-bottom:18px;
  }
  .sim-eyebrow::before{ content:""; width:22px; height:1px; background:var(--azulejo); }
  .sim-title{
    font-size:clamp(1.7rem, 4.2vw, 2.5rem);
    line-height:1.2; max-width:680px; margin:0 auto 16px;
  }
  .sim-title em{ font-style:italic; color:var(--oak-deep); }
  .sim-sub{
    max-width:520px; margin:0 auto 8px; color:var(--walnut-soft); font-size:1.02rem;
  }

  /* ---------- TARJETA DEL SIMULADOR ---------- */
  .sim-card{
    max-width:560px; margin:36px auto 0; background:var(--card);
    border-radius:6px; box-shadow:var(--shadow); padding:32px 28px 28px;
    border:1px solid var(--line);
  }
  .sim-step-label{
    font-family:'IBM Plex Mono', monospace; font-size:0.72rem; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--oak-deep); margin-bottom:6px;
  }
  .sim-step-title{ font-size:1.25rem; margin-bottom:18px; }

  .drop-zone{
    border:2px dashed var(--line); border-radius:6px;
    padding:36px 20px; text-align:center; cursor:pointer;
    transition:border-color .2s ease, background .2s ease;
  }
  .drop-zone:hover, .drop-zone.dragover{ border-color:var(--ocre); background:rgba(192,147,46,0.06); }
  .drop-zone-icon{ font-size:2.2rem; margin-bottom:10px; }
  .drop-zone-text{ font-weight:600; margin-bottom:4px; }
  .drop-zone-hint{ font-size:0.82rem; color:var(--walnut-soft); }
  #simFotoInput{ display:none; }

  .sim-preview{ position:relative; border-radius:6px; overflow:hidden; margin-bottom:18px; }
  .sim-preview img{ width:100%; display:block; max-height:340px; object-fit:cover; }
  .sim-preview-cambiar{
    position:absolute; bottom:10px; right:10px;
    background:rgba(42,33,24,0.82); color:var(--stone-light);
    font-size:0.78rem; padding:7px 12px; border-radius:4px; border:none; cursor:pointer;
  }

  .sim-group{ margin-bottom:16px; }
  .sim-group label{
    display:block; font-size:0.84rem; font-weight:600; margin-bottom:6px; color:var(--walnut);
  }
  .sim-group input{
    width:100%; padding:12px 13px; border-radius:6px; border:1px solid var(--line);
    background:#fff; font-family:'Work Sans',sans-serif; font-size:0.95rem; color:var(--walnut);
  }
  .sim-group input:focus{ outline:none; border-color:var(--ocre); }

  .sim-consentimiento{
    display:flex; align-items:flex-start; gap:10px; margin:16px 0 4px;
    font-size:0.82rem; color:var(--walnut-soft); line-height:1.4; cursor:pointer;
  }
  .sim-consentimiento input{ width:18px; height:18px; flex-shrink:0; margin-top:1px; accent-color:var(--ocre); }

  .sim-btn-enviar{
    width:100%; justify-content:center; border:none; margin-top:6px;
  }
  .sim-status{ font-size:0.84rem; text-align:center; min-height:20px; margin-top:12px; }
  .sim-status-ok{ color:var(--azulejo); font-weight:600; }
  .sim-status-error{ color:#B3401F; font-weight:600; }
  .sim-back{
    background:none; border:none; color:var(--walnut-soft); font-size:0.84rem;
    cursor:pointer; margin-top:14px; text-decoration:underline;
  }

  .sim-opcion{
    display:flex; align-items:center; gap:12px; width:100%;
    padding:14px 15px; margin-bottom:10px; border-radius:6px; border:1px solid var(--line);
    background:#fff; font-family:'Work Sans',sans-serif; font-size:0.95rem; color:var(--walnut);
    cursor:pointer; text-align:left; transition:border-color .15s ease, background .15s ease;
  }
  .sim-opcion:hover{ border-color:var(--ocre); }
  .sim-opcion.activa{ border-color:var(--ocre); background:rgba(192,147,46,0.08); font-weight:600; }
  .sim-opcion-circulo{
    width:18px; height:18px; border-radius:50%; border:2px solid var(--line); flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .sim-opcion.activa .sim-opcion-circulo{ border-color:var(--ocre); }
  .sim-opcion.activa .sim-opcion-circulo::after{
    content:""; width:9px; height:9px; border-radius:50%; background:var(--ocre);
  }

  .sim-exito{ text-align:center; padding:8px 0; }
  .sim-exito-icon{ font-size:2.6rem; margin-bottom:14px; }
  .sim-exito h3{ font-size:1.3rem; margin-bottom:10px; }
  .sim-exito p{ color:var(--walnut-soft); margin-bottom:6px; }

  /* ---------- SEGUIMIENTO: un solo bloque, tres caminos ---------- */
  .sim-avance-eyebrow{
    display:flex; align-items:center; gap:10px;
    font-family:'IBM Plex Mono', monospace; font-size:0.74rem;
    letter-spacing:0.1em; text-transform:uppercase;
    color:var(--azulejo); margin:34px auto 12px; max-width:560px;
  }
  .sim-avance-eyebrow::after{ content:""; flex:1; height:1px; background:var(--line); }
  .sim-avance-bloque{
    max-width:560px; margin:0 auto; background:var(--card); border:1px solid var(--line);
    border-radius:6px; box-shadow:var(--shadow); overflow:hidden;
  }
  .sim-avance-fila{
    position:relative; display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding:20px 22px; text-decoration:none;
    border-top:1px solid var(--line); transition:background .15s ease, padding-left .15s ease;
  }
  .sim-avance-fila:first-child{ border-top:none; }
  .sim-avance-fila:hover, .sim-avance-fila:active, .sim-avance-fila:focus-visible{
    background:rgba(201,162,39,0.06); padding-left:28px;
  }
  .sim-avance-texto{ flex:1; min-width:0; }
  .sim-avance-pregunta{
    display:block; font-family:'Fraunces',serif; font-style:italic; font-weight:500;
    font-size:1.02rem; color:var(--oak-deep); margin-bottom:4px;
  }
  .sim-avance-sub{ display:block; font-size:0.83rem; color:var(--walnut-soft); line-height:1.45; }
  .sim-avance-flecha{
    flex-shrink:0; width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); color:var(--oak-deep); font-size:1rem;
    transition:background .15s ease, border-color .15s ease, transform .15s ease;
  }
  .sim-avance-fila:hover .sim-avance-flecha, .sim-avance-fila:active .sim-avance-flecha{
    background:var(--oak-deep); border-color:var(--oak-deep); color:var(--stone-light); transform:translateX(3px);
  }
  .sim-avance-fila.sim-avance-principal{
    border-left:3px solid var(--ocre); padding-left:19px;
  }
  .sim-avance-fila.sim-avance-principal:hover, .sim-avance-fila.sim-avance-principal:active{ padding-left:27px; }

  .sim-section-espacio{ padding-bottom:64px; }

  /* ---------- FOOTER (idéntico al index) ---------- */
  footer{ background:var(--walnut); color:#CFC5B5; padding:36px 0 26px; margin-top:56px; text-align:center; }
  .footer-brand{font-family:'Fraunces',serif; color:var(--stone-light); font-size:1.15rem; margin-bottom:18px;}
  .footer-brand-giralda{ color:var(--ocre); }
  .footer-bottom{
    border-top:1px solid #453626; padding-top:18px;
    display:flex; flex-direction:column; align-items:center; font-size:0.78rem; color:#8B8071;
    gap:6px;
  }

  @media (max-width:640px){
    .sim-hero{ padding:48px 0 4px; }
    .sim-card{ margin-top:26px; padding:24px 18px 22px; }
  }
</style>
</head>
<body>

<header>
  <div class="nav">
    <div class="brand">
      <span class="word-cream">Suelos</span>
      <span class="word-oak">La</span>
      <span class="word-oak">Giralda</span>
    </div>
  </div>
</header>

<section class="sim-hero">
  <div class="wrap">
    <span class="sim-eyebrow">Simulador gratuito</span>
    <h1 class="sim-title" id="simHeroTitulo">Mira tu <em>suelo nuevo</em> antes de decidir.</h1>
  </div>
</section>

<section class="sim-section-espacio">
  <div class="wrap">

    <div class="sim-card" id="simCard">
      <!-- El contenido de cada paso se genera con JS -->
    </div>

    <div id="simLinks"></div>

  </div>
</section>

<footer>
  <div class="wrap">
    <div class="footer-brand">Suelos <span class="footer-brand-giralda">La Giralda</span></div>
    <div class="footer-bottom">
      <span>© 2026 Suelos La Giralda · Autónomo dado de alta · Seguro de responsabilidad civil</span>
      <span>Sevilla, España</span>
    </div>
  </div>
</footer>

<script>
  const SUPABASE_URL = 'https://abrumjkwcwsftdgcruvr.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_IS8ZPhOtH1F4HemveDU3bg_8JOc8j8F';
  const STORAGE_BUCKET = 'fotos-obra';

  // ---------- Estado del simulador ----------
  let simFotoDataUrl = null;
  let simFotoTipo = 'image/jpeg';
  let simFotoUrlSubida = null;
  let simPlazo = null;
  let simNombreValor = '';
  let simTelefonoValor = '';
  let simConsentimientoValor = false;

  function escapeHtml(texto){
    if(texto == null) return '';
    return String(texto)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function mostrarTituloHero(mostrar){
    const heroTitulo = document.getElementById('simHeroTitulo');
    if(heroTitulo) heroTitulo.style.display = mostrar ? '' : 'none';
  }

  function renderPasoFoto(){
    mostrarTituloHero(true);
    const card = document.getElementById('simCard');
    card.innerHTML = `
      <div class="sim-step-label">Paso 1 de 3</div>
      <h2 class="sim-step-title">Sube una foto de tu salón</h2>
      <div class="drop-zone" id="simDropZone">
        <div class="drop-zone-icon">📷</div>
        <div class="drop-zone-text">Toca para elegir una foto</div>
        <div class="drop-zone-hint">Cuanto más despejado se vea el suelo, mejor sale la simulación.</div>
      </div>
      <input type="file" id="simFotoInput" accept="image/*">
    `;
    const dropZone = document.getElementById('simDropZone');
    const input = document.getElementById('simFotoInput');
    dropZone.addEventListener('click', ()=> input.click());
    input.addEventListener('change', ()=>{
      const file = input.files[0];
      if(!file) return;
      const hint = dropZone.querySelector('.drop-zone-text');
      if(hint) hint.textContent = 'Cargando foto…';
      const lector = new FileReader();
      lector.onload = ()=>{
        simFotoDataUrl = lector.result;
        simFotoTipo = file.type || 'image/jpeg';
        renderPasoTiempo();
      };
      lector.onerror = ()=>{
        if(hint) hint.textContent = 'No se pudo leer esa foto, prueba con otra.';
      };
      lector.readAsDataURL(file);
    });
  }

  function renderPasoTiempo(){
    mostrarTituloHero(false);
    const card = document.getElementById('simCard');
    const opciones = ['Todavía lo estoy pensando', 'En los próximos meses', 'Lo antes posible'];
    card.innerHTML = `
      <div class="sim-step-label">Paso 2 de 3</div>
      <h2 class="sim-step-title">¿Para cuándo te gustaría cambiarlo?</h2>
      ${opciones.map(op => `
        <button type="button" class="sim-opcion ${simPlazo === op ? 'activa' : ''}" data-plazo="${escapeHtml(op)}">
          <span class="sim-opcion-circulo"></span>
          <span>${escapeHtml(op)}</span>
        </button>
      `).join('')}
      <button type="button" class="btn btn-primary sim-btn-enviar" id="simContinuar" style="margin-top:8px;">Continuar</button>
      <p class="sim-status" id="simStatus"></p>
      <button type="button" class="sim-back" id="simVolverFoto">← Elegir otra foto</button>
    `;
    card.querySelectorAll('.sim-opcion').forEach(op=>{
      op.addEventListener('click', ()=>{
        card.querySelectorAll('.sim-opcion').forEach(o => o.classList.remove('activa'));
        op.classList.add('activa');
        simPlazo = op.dataset.plazo;
      });
    });
    document.getElementById('simVolverFoto').addEventListener('click', renderPasoFoto);
    document.getElementById('simContinuar').addEventListener('click', ()=>{
      const statusEl = document.getElementById('simStatus');
      if(!simPlazo){
        statusEl.textContent = 'Elige una opción para continuar.';
        statusEl.className = 'sim-status sim-status-error';
        return;
      }
      renderPasoDatos();
    });
  }

  function renderPasoDatos(){
    mostrarTituloHero(false);
    const card = document.getElementById('simCard');
    card.innerHTML = `
      <div class="sim-step-label">Paso 3 de 3</div>
      <h2 class="sim-step-title">¿A quién le enviamos la simulación?</h2>
      <div class="sim-preview">
        <img src="${simFotoDataUrl}" alt="Foto de tu salón">
        <button type="button" class="sim-preview-cambiar" id="simCambiarFoto">Cambiar foto</button>
      </div>
      <div class="sim-group">
        <label>Tu nombre</label>
        <input type="text" id="simNombre" placeholder="Nombre" value="${escapeHtml(simNombreValor)}">
      </div>
      <div class="sim-group">
        <label>WhatsApp donde te enviamos la simulación</label>
        <input type="tel" id="simTelefono" placeholder="600 000 000" value="${escapeHtml(simTelefonoValor)}">
      </div>
      <label class="sim-consentimiento">
        <input type="checkbox" id="simConsentimiento" ${simConsentimientoValor ? 'checked' : ''}>
        <span>Acepto que Suelos La Giralda use esta foto para hacer la simulación de mi suelo y me envíe un enlace donde pueda verla.</span>
      </label>
      <button type="button" class="btn btn-primary sim-btn-enviar" id="simEnviar">Enviar</button>
      <p class="sim-status" id="simStatus"></p>
      <button type="button" class="sim-back" id="simVolverTiempo">← Volver</button>
    `;
    document.getElementById('simCambiarFoto').addEventListener('click', renderPasoFoto);
    document.getElementById('simVolverTiempo').addEventListener('click', renderPasoTiempo);
    document.getElementById('simEnviar').addEventListener('click', ()=>{
      simNombreValor = document.getElementById('simNombre').value.trim();
      simTelefonoValor = document.getElementById('simTelefono').value.trim();
      simConsentimientoValor = document.getElementById('simConsentimiento').checked;
      const statusEl = document.getElementById('simStatus');
      if(!simConsentimientoValor){
        statusEl.textContent = 'Marca la casilla de autorización para poder enviarla.';
        statusEl.className = 'sim-status sim-status-error';
        return;
      }
      enviarSimulacion();
    });
  }

  function renderPasoExito(){
    window.scrollTo({ top: 0, behavior: 'smooth' });
    mostrarTituloHero(true);

    const card = document.getElementById('simCard');
    card.innerHTML = `
      <div class="sim-exito">
        <div class="sim-exito-icon">🏡</div>
        <h3>¡Recibido!</h3>
        <p>En menos de 24h te enviamos por WhatsApp el enlace con la simulación de tu suelo, lista para ver.</p>
      </div>
    `;
    document.getElementById('simLinks').innerHTML = `
      <div class="sim-avance-eyebrow">Mientras tanto</div>
      <div class="sim-avance-bloque">
        <a href="index.html#asesor" class="sim-avance-fila sim-avance-principal">
          <div class="sim-avance-texto">
            <span class="sim-avance-pregunta">¿Aún tienes dudas de qué suelo elegir?</span>
            <span class="sim-avance-sub">Resuélvelo en 1 minuto con nuestro Asesor de Suelo en línea, totalmente gratuito.</span>
          </div>
          <span class="sim-avance-flecha">→</span>
        </a>
        <a href="index.html#presupuesto" class="sim-avance-fila">
          <div class="sim-avance-texto">
            <span class="sim-avance-pregunta">¿Quieres saber cuánto te costaría?</span>
            <span class="sim-avance-sub">Calcula el precio con tus medidas exactas, sin esperar a la simulación.</span>
          </div>
          <span class="sim-avance-flecha">→</span>
        </a>
        <a href="index.html#contacto" class="sim-avance-fila">
          <div class="sim-avance-texto">
            <span class="sim-avance-pregunta">¿Prefieres que alguien te lo cuente en persona?</span>
            <span class="sim-avance-sub">Visita técnica gratuita, sin compromiso.</span>
          </div>
          <span class="sim-avance-flecha">→</span>
        </a>
      </div>
    `;
  }

  async function enviarSimulacion(){
    const nombre = simNombreValor;
    const telefono = simTelefonoValor;
    const statusEl = document.getElementById('simStatus');
    const btn = document.getElementById('simEnviar');
    statusEl.textContent = '';
    statusEl.className = 'sim-status';

    if(!telefono){
      statusEl.textContent = 'Por favor, indica tu WhatsApp.';
      statusEl.className = 'sim-status sim-status-error';
      return;
    }
    if(!simFotoDataUrl){
      statusEl.textContent = 'Falta la foto, vuelve a elegirla.';
      statusEl.className = 'sim-status sim-status-error';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Enviando…';

    try{
      // 1) Convertir la foto (ya leída en memoria) de vuelta a bytes, y subirla
      // al mismo bucket de Storage que usa el panel.
      const blob = await (await fetch(simFotoDataUrl)).blob();
      const extension = (simFotoTipo.split('/')[1] || 'jpg').toLowerCase();
      const nombreArchivo = `simulador/${Date.now()}.${extension}`;
      const resUpload = await fetch(`${SUPABASE_URL}/storage/v1/object/${STORAGE_BUCKET}/${nombreArchivo}`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Content-Type': simFotoTipo
        },
        body: blob
      });
      if(!resUpload.ok) throw new Error('subida');
      simFotoUrlSubida = `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${nombreArchivo}`;

      // 2) Crear el lead en la misma tabla que usa el resto de la web
      const resLead = await fetch(SUPABASE_URL + '/rest/v1/leads', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({
          formulario: 'Simulador',
          nombre: nombre || '(no indicado)',
          telefono: telefono,
          foto_url: simFotoUrlSubida,
          plazo: simPlazo || '(no indicado)',
          consiente_uso_foto: true,
          consentimiento_fecha: new Date().toISOString()
        })
      });
      if(!resLead.ok) throw new Error('lead');

      renderPasoExito();
    } catch(err){
      statusEl.textContent = 'No se pudo enviar. Prueba de nuevo o escríbenos por WhatsApp.';
      statusEl.className = 'sim-status sim-status-error';
      btn.disabled = false;
      btn.textContent = 'Enviar';
    }
  }

  renderPasoFoto();
</script>
